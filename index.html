<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>查薪資月份</title><style>
:root{--p:#BE6148;--pd:#7D3D2C;--pl:#FDF0ED}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang TC',sans-serif;background:#F3F4F6;color:#1f2937;padding:20px 16px;max-width:520px;margin:0 auto;line-height:1.6}
h1{font-size:19px;color:var(--pd);margin-bottom:14px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px}
label{font-size:12px;font-weight:800;color:var(--pd);display:block;margin-bottom:5px}
input{width:100%;padding:11px;border:1.5px solid #E5D5CF;border-radius:9px;font-size:15px;font-family:inherit;margin-bottom:10px}
button{width:100%;padding:13px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.st{font-size:13px;margin-top:10px;color:#6b7280}.err{color:#C0392B;font-weight:700}
.mon{border:1.5px solid #E5D5CF;border-radius:9px;padding:11px 13px;margin-bottom:8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.mon b{color:var(--pd)}
.ok{color:#16794C;font-weight:700}.no{color:#C0392B;font-weight:700}
.warn{background:#FFF8E6;border-left:3px solid #E8B84B;border-radius:8px;padding:11px 13px;font-size:12.5px;color:#7A5A12;margin-top:12px;line-height:1.7}
</style></head><body>
<h1>🔍 查薪資月份狀況</h1>
<div class="card">
<label>老闆密碼</label><input type="password" id="pw" placeholder="輸入老闆密碼">
<button onclick="run()">查詢</button>
<div class="st" id="st"></div>
</div>
<div id="out"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyDp3j6gxWptUPSUEohR27IfkCjzzBk1Gl4',authDomain:'punch-83688.firebaseapp.com',databaseURL:'https://punch-83688-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'punch-83688'});
const db=getDatabase(app),auth=getAuth(app);
async function g(p){const s=await get(ref(db,p));return s.exists()?s.val():null}
window.run=async function(){
 const st=document.getElementById('st'),out=document.getElementById('out');out.innerHTML='';
 const pw=document.getElementById('pw').value.trim();
 if(!pw){st.innerHTML='<span class="err">請輸入密碼</span>';return}
 st.textContent='查詢中…';
 try{
  await signInWithEmailAndPassword(auth,'nilu0914bliss@gmail.com',pw);
  const sal=await g('salaries')||{};
  const keys=Object.keys(sal).filter(k=>/^\d{4}-\d{1,2}$/.test(k)).sort().reverse();
  let html='<div class="card"><b style="color:#7D3D2C;font-size:15px">salaries 節點裡的所有月份</b><br><br>';
  if(!keys.length){ html+='<span class="no">⚠️ 完全沒有任何月份的薪資資料</span>'; }
  keys.forEach(k=>{
    const m=sal[k]||{};
    const settled=m.__settled===true;
    const empCount=Object.keys(m).filter(x=>!x.startsWith('__')).length;
    const goodFmt=/^\d{4}-\d{2}$/.test(k);
    html+='<div class="mon"><div><b>'+k+'</b>'+(goodFmt?'':' <span class="no">格式異常!</span>')+'<br><span style="font-size:11px;color:#999">'+empCount+' 位員工資料</span></div><div>'+(settled?'<span class="ok">✓ 已結算</span>':'<span class="no">✗ 未結算</span>')+'</div></div>';
  });
  html+='</div>';
  // 特別檢查六月
  const jun=['2026-06','2026-6'].find(k=>sal[k]);
  let diag='';
  if(!jun){
    diag='<div class="warn">🔴 <b>找不到六月資料</b>：salaries 裡沒有 2026-06 也沒有 2026-6。<br>代表六月從未結算，或資料被刪除了。這就是員工端看不到六月、被打回七月的原因。</div>';
  } else if(jun==='2026-6'){
    diag='<div class="warn">🔴 <b>找到問題了！</b>六月存成「2026-6」(月份沒補0)，但系統只認「2026-06」格式，所以被過濾掉、看不到。<br>需要把資料從 2026-6 搬到 2026-06。</div>';
  } else {
    const m=sal['2026-06']||{};
    if(m.__settled===true){
      diag='<div class="warn">✓ 六月(2026-06)存在且已結算，格式正常。<br>如果員工端還看不到，可能是快取問題，請重新整理員工頁面。</div>';
    } else {
      diag='<div class="warn">🟡 六月(2026-06)存在但<b>未結算</b>(__settled 不是 true)。<br>雖然總管頁面顯示已結算，但資料裡沒存到。請到六月薪資頁重新按一次「確認結算」。</div>';
    }
  }
  out.innerHTML=html+diag;
  st.textContent='';
 }catch(e){st.innerHTML='<span class="err">'+((e&&e.code==='auth/invalid-credential')?'密碼錯誤':(e.message||e))+'</span>'}
};
</script></body></html>
